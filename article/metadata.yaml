abstract: "We independently re-implement, from the paper text, the main calibration experiment of Adler et al.
           (ICLR 2026), which reports that time series foundation models (TSFMs) are better calibrated than
           ARIMA and N-BEATS baselines and reach probabilistic calibration error (PCE) close to or below 0.05.
           We test this claim on all six of the paper's real datasets (Reviews, M5, NYC Crime, Heart-Rate,
           Glucose, Patents) with Chronos-Bolt (small, base), TimesFM 2.5 (200M, a substitute for the paper's
           TimesFM 2.0), TiRex, ARIMA and N-BEATS (the paper's full grid, three seeds), using 64-step
           rolling-origin forecasts. All TSFMs reach PCE at or below 0.06 on the five datasets where the paper
           claims it; Patents, which the paper exempts, stays high. The TSFMs beat in-sample-selected N-BEATS on
           every dataset and seed, and our primary ARIMA on four of six datasets. On M5 the substitute TimesFM is
           worse than ARIMA, and on Patents all four TSFMs are. Our ARIMA is much better calibrated than the
           paper's on every dataset. An ARIMA refit on the TSFM context matches or beats some TSFMs on four
           datasets, and hold-out-selected N-BEATS beats the worst TSFM in six of eighteen runs. We therefore
           judge the claim partially reproduced. A post-hoc comparison with the authors' code explains our
           differences in MASE and in PCE aggregation, but not the ARIMA gap, because the baseline code is not
           released."

